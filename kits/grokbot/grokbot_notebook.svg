  <rect x="96" y="34" width="24" height="8" rx="1" fill="#1a1a2a"/>
  <rect x="98" y="37" width="18" height="2" fill="#FFFFFF" opacity="0.4"/>
  <!-- pen in right hand -->
  <line x1="100" y1="76" x2="118" y2="52" stroke="#F0C75E" stroke-width="4" stroke-linecap="round"/>
  <line x1="118" y1="52" x2="120" y2="48" stroke="#3A3A3A" stroke-width="3" stroke-linecap="round"/>
