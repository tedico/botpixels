<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <title>Notebook Edit</title>
  <g transform="translate(4,24) scale(4)">
    <path d="M8 5h8v1h-8zM6 6h12v1h-12zM5 7h9v1h-9zM15 7h4v1h-4zM4 8h5v1h-5zM10 8h6v1h-6zM17 8h3v1h-3zM4 9h6v1h-6zM11 9h9v1h-9zM3 10h8v1h-8zM12 10h9v1h-9zM3 11h18v1h-18zM3 12h18v1h-18zM3 13h18v1h-18zM3 14h18v1h-18zM4 15h16v1h-16zM4 16h16v1h-16zM5 17h14v1h-14zM6 18h12v1h-12zM8 19h8v1h-8z" fill="#E6ECF5"/>
    <path d="M14 7h1v1h-1zM9 8h1v1h-1zM16 8h1v1h-1zM10 9h1v1h-1zM11 10h1v1h-1z" fill="#0F1115"/>
  </g>
  <g transform="translate(-12,0)">
  <!-- notebook body -->
  <rect x="86" y="2" width="38" height="44" rx="3" fill="#3A3A3A"/>
  <!-- code cell 1 (with In[] marker) -->
  <rect x="90" y="6" width="4" height="10" rx="1" fill="#5B9BD5"/>
  <rect x="96" y="6" width="24" height="10" rx="1" fill="#2a2a3a"/>
  <rect x="98" y="9" width="14" height="2" fill="#6BBF6B" opacity="0.7"/>
  <rect x="98" y="13" width="10" height="2" fill="#6BBF6B" opacity="0.5"/>
  <!-- code cell 2 -->
  <rect x="90" y="20" width="4" height="10" rx="1" fill="#5B9BD5"/>
  <rect x="96" y="20" width="24" height="10" rx="1" fill="#2a2a3a"/>
  <rect x="98" y="23" width="16" height="2" fill="#F0C75E" opacity="0.7"/>
  <rect x="98" y="27" width="8" height="2" fill="#F0C75E" opacity="0.5"/>
